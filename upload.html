<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牛逼源 · 管理</title>
<style>
  :root{ --bg:#0d1117; --card:#161b22; --bd:#30363d; --fg:#e6edf3; --dim:#8b949e;
         --ok:#3fb950; --warn:#d29922; --err:#f85149; --acc:#58a6ff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
       background:var(--bg); color:var(--fg); padding:14px 12px 40px;}
  h1{font-size:20px; margin:2px 0 1px;}
  .sub{color:var(--dim); font-size:13px; margin-bottom:12px;}
  .card{background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; margin:12px 0;}
  label{display:block; font-size:13px; color:var(--dim); margin:8px 0 4px;}
  input[type=password],input[type=text]{width:100%; padding:11px; font-size:16px;
       background:#0d1117; border:1px solid var(--bd); border-radius:10px; color:var(--fg);}
  button{padding:13px; font-size:16px; font-weight:600; border:none; border-radius:11px;
         color:#fff; background:var(--acc); margin-top:10px; cursor:pointer;}
  button:active{opacity:.8;} button.ghost{background:transparent; border:1px solid var(--bd); color:var(--fg); font-weight:400;}
  button.del{background:var(--err); padding:8px 14px; font-size:14px; border-radius:9px; margin:0; white-space:nowrap;}
  button:disabled{opacity:.4; pointer-events:none;}
  .row{display:flex; gap:8px;} .row button{flex:1;}
  .filebox{border:2px dashed var(--bd); border-radius:12px; padding:20px; text-align:center; color:var(--dim);}
  .filebox input{display:none;}
  .flist{margin-top:8px; font-size:13px; color:var(--dim);}
  .pkg{border:1px solid var(--bd); border-radius:11px; padding:10px 12px; margin-top:10px; background:#0d1117;}
  .pkg .top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .pkg .nm{font-weight:600; font-size:15px; word-break:break-all;}
  .pkg .meta{font-size:12px; color:var(--dim); margin-top:4px; line-height:1.5;}
  .pkg .meta b{color:var(--fg); font-weight:500;}
  .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(88,166,255,.18); color:var(--acc); margin-left:4px;}
  .tag.jb{background:rgba(210,153,34,.2); color:var(--warn);}
  .empty{color:var(--dim); text-align:center; padding:24px 0; font-size:14px;}
  .log{background:#000; color:#c9d1d9; font-family:ui-monospace,Menlo,monospace; font-size:12px;
       border-radius:10px; padding:10px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; display:none; margin-top:12px;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
        border-top-color:#fff; border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px;}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{color:var(--dim); font-size:12px; margin-top:14px; line-height:1.5;}
</style>
</head>
<body>
  <h1>📦 牛逼源 · 管理</h1>
  <div class="sub">上传 / 列表 / 删除 · 上传删除后自动重建索引</div>

  <div class="card">
    <label>仓库 (owner/repo)</label>
    <input type="text" id="repo" placeholder="i3i4i5/i3i4i5.github.io">
    <label>GitHub PAT（repo 权限，只存本机浏览器）</label>
    <input type="password" id="token" placeholder="ghp_...">
    <div class="row">
      <button class="ghost" id="savebtn">保存配置</button>
      <button class="ghost" id="loadbtn">📋 刷新列表</button>
    </div>
  </div>

  <div class="card">
    <label>⬆ 上传 deb（可多选）</label>
    <label class="filebox" for="deb">
      <input type="file" id="deb" accept=".deb,application/vnd.debian.binary-package" multiple>
      点我选择 deb 文件
    </label>
    <div class="flist" id="flist"></div>
    <button id="uploadbtn">⬆ 上传到源</button>
  </div>

  <div class="card">
    <label>📦 当前包（点「刷新列表」更新）</label>
    <div id="pkglist"><div class="empty">点上方「刷新列表」加载</div></div>
  </div>

  <div class="log" id="log"></div>

  <div class="foot">
    PAT 只存在你手机浏览器 localStorage，不发给第三方。用完建议吊销。<br>
    上传/删除后由 GitHub Actions 自动重建索引，约 1 分钟，再点「刷新列表」。
  </div>

<script>
const $ = id => document.getElementById(id);
function log(msg){ const el=$('log'); el.style.display='block'; el.textContent += msg+'\n'; el.scrollTop=el.scrollHeight; }
function repo(){ return $('repo').value.trim(); }
function tok(){ return $('token').value.trim(); }

// ---- 配置 ----
$('savebtn').onclick = ()=>{ localStorage.setItem('niubi_repo',repo()); localStorage.setItem('niubi_token',tok()); alert('配置已保存到本机浏览器'); };
$('repo').value = localStorage.getItem('niubi_repo')||'i3i4i5/i3i4i5.github.io';
$('token').value = localStorage.getItem('niubi_token')||'';

// ---- 文件选择 ----
let files = [];
$('deb').onchange = e=>{ files=[...e.target.files]; const el=$('flist');
  el.textContent = files.length ? files.map(f=>f.name+' ('+(f.size/1024).toFixed(0)+'KB)').join('、') : ''; };

// ---- GitHub API ----
async function api(path, method='GET', body){
  const r = await fetch(`https://api.github.com/repos/${repo()}${path}`, {method,
    headers:{ 'Authorization':'token '+tok(), 'Accept':'application/vnd.github+json',
              'Content-Type':'application/json', 'User-Agent':'niubi' },
    body: body?JSON.stringify(body):undefined });
  if(r.status===204) return null;
  const t = await r.text();
  if(!r.ok) throw new Error(`${method} ${path} → ${r.status}: ${t.slice(0,300)}`);
  return JSON.parse(t);
}
function b64(u8){ let s=''; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s+=String.fromCharCode.apply(null,u8.subarray(i,i+C)); return btoa(s); }

// ---- 上传 ----
$('uploadbtn').onclick = async ()=>{
  const t=tok(); if(!files.length) return alert('请选择 deb');
  if(!t || !repo().includes('/')) return alert('请填 PAT 和仓库');
  $('savebtn').onclick(); localStorage.setItem('niubi_repo',repo()); localStorage.setItem('niubi_token',t);
  const btn=$('uploadbtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> 上传中…';
  try{
    log(`\n=== 上传 ${files.length} 个 → ${repo()} ===`);
    for(const f of files){
      const path=`debs/${encodeURIComponent(f.name)}`;
      let sha=null; try{ sha=(await api(`/contents/${path}`)).sha; }catch(e){ if(!e.message.includes('404')) throw e; }
      log(`上传 ${f.name} (${(f.size/1024).toFixed(0)}KB)${sha?' [覆盖]':' [新增]'}`);
      await api(`/contents/${path}`,'PUT',{content:b64(new Uint8Array(await f.arrayBuffer())),
        message:`upload ${f.name}`, branch:'main', ...(sha?{sha}:{})});
      log('  ✓');
    }
    log('✅ 完成。索引约 1 分钟后自动重建，再点「刷新列表」。');
    files=[]; $('deb').value=''; $('flist').textContent='';
  }catch(e){ log('✗ '+e.message); alert('上传出错：\n'+e.message); }
  btn.disabled=false; btn.textContent='⬆ 上传到源';
};

// ---- 列表 ----
function parsePackages(text){
  const list=[]; for(const block of text.split(/\n\n+/)){
    if(!/^Package:/m.test(block)) continue;
    const g=k=>(block.match(new RegExp('^'+k+':\\s*(.+)$','m'))||[])[1]||'';
    list.push({pkg:g('Package'),ver:g('Version'),arch:g('Architecture'),file:g('Filename'),desc:g('Name')||g('Description')});
  } return list;
}
$('loadbtn').onclick = async ()=>{
  const box=$('pkglist'); box.innerHTML='<div class="empty"><span class="spin"></span> 加载中…</div>';
  try{
    const debs = await api('/contents/debs');
    const owner = repo().split('/')[0];
    let pkgs=[]; try{ pkgs=parsePackages(await (await fetch(`https://${owner}.github.io/Packages`)).text()); }catch(e){}
    if(!debs || !debs.length){ box.innerHTML='<div class="empty">源里还没有包</div>'; return; }
    box.innerHTML='';
    for(const d of debs){
      const fname=d.name;
      const info=pkgs.find(p=>p.file===`debs/${fname}`) || pkgs.find(p=>p.file.endsWith(fname));
      const meta=document.createElement('div'); meta.className='pkg';
      const nm = info ? (info.desc||info.pkg) : fname;
      const arch = info?info.arch:'';
      meta.innerHTML = `<div class="top"><span class="nm">${esc(nm)}</span>` +
        `<button class="del" data-name="${esc(fname)}" data-sha="${d.sha}">删除</button></div>` +
        `<div class="meta">` +
        (info?`<b>${esc(info.pkg)}</b> v${esc(info.ver)} <span class="tag">${esc(arch)}</span><br>`:'') +
        `大小 ${(d.size/1024).toFixed(0)}KB · 文件 ${esc(fname)}` +
        `</div>`;
      box.appendChild(meta);
    }
    box.querySelectorAll('button.del').forEach(b=> b.onclick=()=>delDeb(b.dataset.name,b.dataset.sha));
  }catch(e){ box.innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`; }
};
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- 删除 ----
async function delDeb(name, sha){
  if(!confirm(`确定删除 ${name} ？\n删除后索引会自动重建。`)) return;
  try{
    log(`删除 debs/${name} …`);
    await api(`/contents/${encodeURIComponent('debs/'+name)}`,'DELETE',{sha, message:`delete ${name}`, branch:'main'});
    log('✓ 已删除，索引约 1 分钟后自动重建');
    $('loadbtn').onclick();
  }catch(e){ log('✗ '+e.message); alert('删除出错：\n'+e.message); }
}
</script>
</body>
</html>
