<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>牛逼源 · 管理</title>
<style>
  :root{ --bg:#0d1117; --card:#161b22; --bd:#30363d; --fg:#e6edf3; --dim:#8b949e;
         --ok:#3fb950; --warn:#d29922; --err:#f85149; --acc:#58a6ff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
       background:var(--bg); color:var(--fg); padding:14px 12px 40px;}
  h1{font-size:20px; margin:2px 0 1px;}
  .sub{color:var(--dim); font-size:13px; margin-bottom:12px;}
  .card{background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:12px 14px; margin:12px 0;}
  .cardhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .ttl{font-size:13px; color:var(--dim); font-weight:600;}
  label{display:block; font-size:13px; color:var(--dim); margin:8px 0 4px;}
  input[type=password],input[type=text],textarea{width:100%; padding:11px; font-size:16px; font-family:inherit;
       background:#0d1117; border:1px solid var(--bd); border-radius:10px; color:var(--fg);}
  textarea{resize:vertical; min-height:70px;}
  button{padding:13px; font-size:16px; font-weight:600; border:none; border-radius:11px;
         color:#fff; background:var(--acc); margin-top:10px; cursor:pointer;}
  button:active{opacity:.8;} button.ghost{background:transparent; border:1px solid var(--bd); color:var(--fg); font-weight:400;}
  button.mini{padding:7px 14px; font-size:13px; border-radius:9px; margin:0; background:var(--bd); font-weight:500;}
  button.mini.green{background:var(--ok); color:#000;}
  button.del{background:var(--err); padding:8px 13px; font-size:14px; border-radius:9px; margin:0;}
  button:disabled{opacity:.4; pointer-events:none;}
  .row{display:flex; gap:8px;} .row button{flex:1;}
  .filebox{border:2px dashed var(--bd); border-radius:12px; padding:20px; text-align:center; color:var(--dim);}
  .filebox input{display:none;}
  .flist{margin-top:8px; font-size:13px; color:var(--dim); line-height:1.6;}
  .pkg{border:1px solid var(--bd); border-radius:11px; padding:10px 12px; margin-top:10px; background:#0d1117;}
  .pkg .top{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .pkg .nm{font-weight:600; font-size:15px; word-break:break-all;}
  .pkg .acts{white-space:nowrap;}
  .pkg .meta{font-size:12px; color:var(--dim); margin-top:5px; line-height:1.5;}
  .pkg .meta b{color:var(--fg); font-weight:500;}
  .tag{display:inline-block; font-size:11px; padding:1px 7px; border-radius:6px; background:rgba(88,166,255,.18); color:var(--acc); margin-left:4px;}
  .empty{color:var(--dim); text-align:center; padding:24px 0; font-size:14px;}
  .log{background:#000; color:#c9d1d9; font-family:ui-monospace,Menlo,monospace; font-size:12px;
       border-radius:10px; padding:10px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all; display:none; margin-top:12px;}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
        border-top-color:#fff; border-radius:50%; animation:s .7s linear infinite; vertical-align:-2px;}
  @keyframes s{to{transform:rotate(360deg)}}
  .foot{color:var(--dim); font-size:12px; margin-top:14px; line-height:1.5;}
  /* 弹窗 */
  .mask{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:99;}
  .mask.show{display:flex;}
  .sheet{background:var(--card); border-radius:16px 16px 0 0; padding:18px 16px 24px; width:100%; max-width:560px;
         margin:0 auto; animation:up .2s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 4px; font-size:17px; word-break:break-all;}
  .sheet .hint{color:var(--dim); font-size:12px; margin-bottom:12px;}
</style>
</head>
<body>
  <h1>📦 牛逼源 · 管理</h1>
  <div class="sub">上传 / 更新 / 删除 · 自动重建索引</div>

  <div class="card">
    <label>仓库 (owner/repo)</label>
    <input type="text" id="repo" placeholder="i3i4i5/i3i4i5.github.io">
    <label>GitHub PAT（repo 权限，只存本机浏览器）</label>
    <input type="password" id="token" placeholder="ghp_...">
    <button class="ghost" id="savebtn">保存配置</button>
  </div>

  <div class="card">
    <label>⬆ 上传 deb（可多选）</label>
    <label class="filebox" for="deb">
      <input type="file" id="deb" multiple>
      点我选择 deb 文件
    </label>
    <div class="flist" id="flist"></div>
    <button id="uploadbtn">⬆ 上传到源</button>
  </div>

  <div class="card">
    <div class="cardhead">
      <span class="ttl">📦 当前包</span>
      <div>
        <button class="mini" id="reindexbtn">手动索引</button>
        <button class="mini" id="loadbtn">刷新列表</button>
      </div>
    </div>
    <div id="pkglist"><div class="empty">点右上角「刷新列表」加载</div></div>
  </div>

  <div class="log" id="log"></div>

  <input type="file" id="updf" style="display:none">

  <div class="foot">
    PAT 只存在你手机浏览器 localStorage。上传/更新/删除后由 Actions 自动重建索引，约 1 分钟再刷新。<br>
    弹窗里的"名称/详情"留空 = 用包自带；填写 = 源里显示你填的。
  </div>

  <!-- 名称/详情弹窗 -->
  <div class="mask" id="mask">
    <div class="sheet">
      <h3 id="ms-title">编辑插件信息</h3>
      <div class="hint">留空则使用包内自带信息</div>
      <label>插件名称</label>
      <input type="text" id="ms-name" placeholder="例：备忘录撤销恢复">
      <label>插件详情</label>
      <textarea id="ms-desc" placeholder="一句话描述功能"></textarea>
      <div class="row">
        <button class="ghost" id="ms-cancel">取消</button>
        <button id="ms-ok">确定</button>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
function log(msg){ const el=$('log'); el.style.display='block'; el.textContent += msg+'\n'; el.scrollTop=el.scrollHeight; }
function repo(){ return $('repo').value.trim(); }
function tok(){ return $('token').value.trim(); }

// 配置
$('savebtn').onclick = ()=>{ localStorage.setItem('niubi_repo',repo()); localStorage.setItem('niubi_token',tok()); alert('配置已保存'); };
$('repo').value = localStorage.getItem('niubi_repo')||'i3i4i5/i3i4i5.github.io';
$('token').value = localStorage.getItem('niubi_token')||'';

// 文件选择（去掉严格 accept，修复 iOS 灰色不能点）
let pendingFiles = [];
let isUpdateMode = false;
let updateTargetName = '';

$('deb').onchange = e => {
  const f = [...e.target.files].filter(x => x.name.toLowerCase().endsWith('.deb'));
  if(!f.length){ alert('请选择 .deb 文件'); return; }
  pendingFiles = f;
  $('flist').innerHTML = f.map(x=>`<div>${x.name} (${(x.size/1024).toFixed(0)}KB)</div>`).join('');
  if(f.length === 1) openModal(f[0].name.replace(/\.deb$/i,''));
  // 多选不弹窗，直接上传用默认信息（点上传时走无 override）
};

// 弹窗逻辑
function openModal(defaultName){
  $('ms-name').value = '';
  $('ms-desc').value = '';
  $('ms-name').placeholder = defaultName;
  $('mask').classList.add('show');
}
function closeModal(){ $('mask').classList.remove('show'); pendingFiles=[]; }
$('ms-cancel').onclick = closeModal;

$('ms-ok').onclick = async () => {
  const name = $('ms-name').value.trim();
  const desc = $('ms-desc').value.trim();
  const files = pendingFiles;
  closeModal();
  if(isUpdateMode) await doUpdate(files[0], name, desc);
  else await doUpload(files, name, desc);
};

// API
async function api(path, method='GET', body){
  const r = await fetch(`https://api.github.com/repos/${repo()}${path}`, {method,
    headers:{ 'Authorization':'token '+tok(), 'Accept':'application/vnd.github+json',
              'Content-Type':'application/json', 'User-Agent':'niubi' },
    body: body?JSON.stringify(body):undefined });
  if(r.status===204) return null;
  const t = await r.text();
  if(!r.ok) throw new Error(`${method} ${path} → ${r.status}: ${t.slice(0,300)}`);
  return JSON.parse(t);
}
function b64(u8){ let s=''; const C=0x8000;
  for(let i=0;i<u8.length;i+=C) s+=String.fromCharCode.apply(null,u8.subarray(i,i+C)); return btoa(s); }

// 保存自定义覆盖信息到 overrides.json
async function saveOverride(filename, name, desc){
  if(!name && !desc) return;
  const path = 'overrides.json';
  let sha=null, data={};
  try{
    const j = await api(`/contents/${path}`);
    sha = j.sha;
    data = JSON.parse(decodeURIComponent(escape(atob(j.content))));
  }catch(e){}
  data[filename] = { name, desc };
  const content = b64(new TextEncoder().encode(JSON.stringify(data, null, 2)));
  const body = { content, message: `update override for ${filename}`, branch:'main', ...(sha?{sha}:{}) };
  await api(`/contents/${path}`,'PUT',body);
}

// 核心上传
async function doUpload(files, customName, customDesc){
  const t=tok(); if(!t || !repo().includes('/')) return alert('请填 PAT 和仓库');
  const btn=$('uploadbtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> 上传中…';
  try{
    log(`\n=== 上传 ${files.length} 个插件 ===`);
    for(const f of files){
      const path=`debs/${encodeURIComponent(f.name)}`;
      let sha=null; try{ sha=(await api(`/contents/${path}`)).sha; }catch(e){}
      log(`上传 ${f.name} (${(f.size/1024).toFixed(0)}KB)`);
      await api(`/contents/${path}`,'PUT',{content:b64(new Uint8Array(await f.arrayBuffer())),
        message:`upload ${f.name}`, branch:'main', ...(sha?{sha}:{})});
      if(customName || customDesc){
        log(`保存自定义名称/详情...`);
        await saveOverride(f.name, customName, customDesc);
      }
      log('  ✓');
    }
    log('✅ 上传完成！约 1 分钟后自动重建索引。');
    $('deb').value=''; $('flist').textContent='';
  }catch(e){ log('✗ '+e.message); alert('出错：\n'+e.message); }
  btn.disabled=false; btn.textContent='⬆ 上传到源';
}

// 更新（替换旧版）
function startUpdate(oldFilename){
  isUpdateMode = true;
  updateTargetName = oldFilename;
  $('updf').click();
}
$('updf').onchange = e => {
  const f = [...e.target.files].filter(x => x.name.toLowerCase().endsWith('.deb'));
  if(!f.length) return;
  pendingFiles = f;
  openModal(f[0].name.replace(/\.deb$/i,''));
};
async function doUpdate(newFile, customName, customDesc){
  const t=tok(); if(!t) return alert('请填 PAT');
  const oldName = updateTargetName;
  isUpdateMode = false;
  try{
    log(`\n=== 更新 ${oldName} -> ${newFile.name} ===`);
    // 1. 删旧
    let oldSha=null; try{ oldSha=(await api(`/contents/${encodeURIComponent('debs/'+oldName)}`)).sha; }catch(e){}
    if(oldSha){
      log(`删除旧版 ${oldName}`);
      await api(`/contents/${encodeURIComponent('debs/'+oldName)}`,'DELETE',{sha:oldSha, message:`remove old ${oldName}`, branch:'main'});
    }
    // 2. 上传新
    const newPath=`debs/${encodeURIComponent(newFile.name)}`;
    log(`上传新版 ${newFile.name}`);
    await api(`/contents/${newPath}`,'PUT',{content:b64(new Uint8Array(await newFile.arrayBuffer())),
      message:`update to ${newFile.name}`, branch:'main'});
    if(customName || customDesc) await saveOverride(newFile.name, customName, customDesc);
    log('✅ 更新完成！约 1 分钟后生效。');
    $('loadbtn').onclick();
  }catch(e){ log('✗ '+e.message); alert('更新出错：\n'+e.message); }
}

// 列表
function parsePackages(text){
  const list=[]; for(const block of text.split(/\n\n+/)){
    if(!/^Package:/m.test(block)) continue;
    const g=k=>(block.match(new RegExp('^'+k+':\\s*(.+)$','m'))||[])[1]||'';
    list.push({pkg:g('Package'),ver:g('Version'),arch:g('Architecture'),file:g('Filename'),desc:g('Name')||g('Description')});
  } return list;
}
// 手动触发索引重建（防止自动失败）
$('reindexbtn').onclick = async ()=>{
  const t=tok(); if(!t) return alert('请填写 PAT');
  const btn=$('reindexbtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    log('\n=== 手动触发索引重建 ===');
    const r = await fetch(`https://api.github.com/repos/${repo()}/actions/workflows/build-repo.yml/dispatches`,{
      method:'POST',
      headers:{ 'Authorization':'token '+t, 'Accept':'application/vnd.github+json', 'User-Agent':'niubi' },
      body: JSON.stringify({ ref:'main', inputs:{ reason:'manual' } })
    });
    if(r.status===204 || r.ok){ log('✓ 已触发，约 1 分钟后生效，再点「刷新列表」'); }
    else { const e=await r.text(); throw new Error(r.status+': '+e.slice(0,200)); }
  }catch(e){ log('✗ '+e.message); alert('触发失败：\n'+e.message+'\n\n可改用网页上传后等自动重建，或直接去 GitHub Actions 页面手动 Run。'); }
  btn.disabled=false; btn.textContent='手动索引';
};

$('loadbtn').onclick = async ()=>{
  const box=$('pkglist'); box.innerHTML='<div class="empty"><span class="spin"></span> 加载中…</div>';
  try{
    const debs = await api('/contents/debs');
    const owner = repo().split('/')[0];
    let pkgs=[]; try{ pkgs=parsePackages(await (await fetch(`https://${owner}.github.io/Packages`)).text()); }catch(e){}
    if(!debs || !debs.length){ box.innerHTML='<div class="empty">源里还没有包</div>'; return; }
    box.innerHTML='';
    for(const d of debs){
      const fname=d.name;
      const info=pkgs.find(p=>p.file===`debs/${fname}`) || pkgs.find(p=>p.file.endsWith(fname));
      const meta=document.createElement('div'); meta.className='pkg';
      const nm = info ? (info.desc||info.pkg) : fname;
      const arch = info?info.arch:'';
      meta.innerHTML = `<div class="top"><span class="nm">${esc(nm)}</span>` +
        `<div class="acts"><button class="upd" data-name="${esc(fname)}">更新</button>` +
        `<button class="del" data-name="${esc(fname)}" data-sha="${d.sha}">删除</button></div></div>` +
        `<div class="meta">` +
        (info?`<b>${esc(info.pkg)}</b> v${esc(info.ver)} <span class="tag">${esc(arch)}</span><br>`:'') +
        `大小 ${(d.size/1024).toFixed(0)}KB · 文件 ${esc(fname)}` +
        `</div>`;
      box.appendChild(meta);
    }
    box.querySelectorAll('button.del').forEach(b=> b.onclick=()=>delDeb(b.dataset.name,b.dataset.sha));
    box.querySelectorAll('button.upd').forEach(b=> b.onclick=()=>startUpdate(b.dataset.name));
  }catch(e){ box.innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`; }
};
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 删除
async function delDeb(name, sha){
  if(!confirm(`确定删除 ${name} ？`)) return;
  try{
    log(`删除 debs/${name} …`);
    await api(`/contents/${encodeURIComponent('debs/'+name)}`,'DELETE',{sha, message:`delete ${name}`, branch:'main'});
    log('✓ 已删除'); $('loadbtn').onclick();
  }catch(e){ log('✗ '+e.message); alert('删除出错：\n'+e.message); }
}

// 自动点一次加载列表
if(tok()) setTimeout(()=>$('loadbtn').onclick(), 300);
</script>
</body>
</html>
