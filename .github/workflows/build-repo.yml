name: Build Jailbreak Repo

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'scripts/**'
      - 'overrides.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils dpkg-dev python3

      - name: Build index
        run: |
          chmod +x scripts/make-index.sh
          REPO_URL="https://${{ github.repository_owner }}.github.io/" bash scripts/make-index.sh

      - name: Commit index
        run: |
          git config user.name "repo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Packages Packages.gz Release
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "auto rebuild index"
          git checkout -B main
          git push origin HEAD:main
