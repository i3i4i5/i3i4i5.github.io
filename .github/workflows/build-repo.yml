name: Build Jailbreak Repo

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: build-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev

      - name: Build index
        env:
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -e
          bash scripts/make-index.sh || { echo "::error::make-index.sh 失败"; exit 1; }
          echo "---- 生成的 Packages ----"; cat Packages

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -A
          if git diff --cached --quiet; then
            echo "索引无变化，跳过"
          else
            git commit -m "chore: rebuild repo index"
            git push -f origin main
          fi
