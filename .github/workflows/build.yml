name: Build & Deploy Rootless APT Repo
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev gzip

      - name: Generate Packages index
        run: |
          mkdir -p repo
          cd debs
          dpkg-scanpackages . /dev/null > ../repo/Packages
          gzip -k ../repo/Packages

      - name: Write Release file
        run: |
          cat > repo/Release <<'EOF'
Origin: Repo
Label: Repo
Suite: stable
Codename: stable
Version: 1.0
Architectures: iphoneos-arm64
Components: main
Description: Rootless Repo
EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
